<title>Epilogue</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:"Hiragino Mincho ProN","Yu Mincho",serif;

background:
radial-gradient(circle at bottom,
rgba(255,220,170,.12),
transparent 35%),
linear-gradient(
180deg,
#f2d1a4 0%,
#c28b81 35%,
#65506b 70%,
#1c2239 100%);

color:white;

}

.container{

width:90%;
max-width:900px;

text-align:center;

padding:60px 20px;

animation:fade 2.5s ease;

}

h1{

font-size:54px;

font-weight:normal;

letter-spacing:.15em;

margin-bottom:70px;

color:#fff7d9;

text-shadow:0 0 18px rgba(255,220,170,.4);

}

.narration{

font-size:22px;

line-height:2.6;

white-space:pre-line;

max-width:720px;

margin:auto;

}

.page-nav{

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

margin-top:90px;

}

.nav-btn{

min-width:180px;

padding:15px 22px;

border-radius:30px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.25);

color:white;

text-decoration:none;

transition:.3s;

}

.nav-btn:hover{

background:rgba(255,255,255,.25);

transform:translateY(-3px);

}

@keyframes fade{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<h1>Epilogue</h1>

<div class="narration">

そして——

物語は、
静かに幕を閉じます。

それぞれの想いは、
胸の奥に残ったまま。

やさしい光のように、
消えることなく、

そっと、
そこに在り続けるのです。

いつかまた、
どこかで——

新しい物語が
始まるその日まで。
</div>
