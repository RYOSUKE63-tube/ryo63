<style>

margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

font-family:"Hiragino Mincho ProN","Yu Mincho",serif;

background:
radial-gradient(circle at top,
rgba(255,235,170,.15),
transparent 30%),
linear-gradient(
180deg,
#181826 0%,
#24233d 45%,
#090910 100%);

color:white;

}

.container{

width:90%;
max-width:900px;
text-align:center;
padding:60px 20px;
animation:fade 2.5s ease;

}

h1{

font-size:54px;
font-weight:normal;

margin-bottom:70px;

.narration{

line-height:2.6;

.page-nav{

.nav-btn{

transform:translateY(-3px);

<body>

<div class="container">

<h1>Prologue</h1>

<div class="narration">

むかし、むかし——

とても遠くて、
どこか近い場所に、

いくつもの物語がありました。

それは、
誰かの願いであり、

誰かの涙であり、

そして、
まだ語られていない想い。

夜の中で静かに揺れる、
小さな光のように、

ひとつひとつが、
誰かの心に残っていきます。

これは、
そんな物語のはじまり。

さあ——
ページをめくってみましょう。
</div>
